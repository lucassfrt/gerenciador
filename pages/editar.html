<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script src="../assets/js/script.js" defer></script>
  <title>Editar obra | Gerenciador de Filmes e Séries</title>
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo principal</a>
  <header class="site-header"><div class="container"><p class="site-name">Gerenciador de Filmes e Séries</p><nav aria-label="Navegação principal"><ul><li><a href="../index.html">Coleção</a></li><li><a href="cadastro.html">Cadastrar obra</a></li></ul></nav></div></header>
  <main id="conteudo-principal" class="container page-content">
    <section class="page-intro"><h1 id="titulo-pagina">Editar obra</h1><p>Altere os dados da obra selecionada.</p></section>
    <section><h2>Dados da obra</h2>
      <form id="form-edicao"><fieldset><legend>Identificação e acompanhamento</legend><div class="form-grid">
        <div class="field field-wide"><label for="titulo">Título *</label><input id="titulo" name="titulo" required></div>
        <div class="field"><label for="tipo">Tipo *</label><select id="tipo" name="tipo" required><option value="filme">Filme</option><option value="serie">Série</option></select></div>
        <div class="field"><label for="genero">Gênero *</label><input id="genero" name="genero" required></div>
        <div class="field"><label for="ano">Ano *</label><input type="number" id="ano" name="ano" min="1888" max="2100" step="1" required></div>
        <div class="field"><label for="status">Status *</label><select id="status" name="status" required><option value="quero-assistir">Quero Assistir</option><option value="assistindo">Assistindo</option><option value="concluido">Concluído</option><option value="abandonado">Abandonado</option></select></div>
        <div class="field"><label for="avaliacao">Avaliação pessoal</label><input type="number" id="avaliacao" name="avaliacao" min="1" max="5" step="1"></div>
        <div class="field field-wide checkbox-field"><input type="checkbox" id="favorito" name="favorito"><label for="favorito">Marcar como favorito</label></div>
        <div class="field field-wide"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes" rows="5"></textarea></div>
      </div></fieldset><p data-feedback class="feedback" role="status"></p><div class="form-actions"><button type="submit">Salvar alterações</button><a href="../index.html">Cancelar</a></div></form>
    </section>
  </main>
  <footer class="site-footer"><div class="container"><p>Gerenciador de Filmes e Séries — Etapa 3.</p></div></footer>
</body>
</html>
